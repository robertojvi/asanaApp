server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/asana_mirror
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:*M@815&699s$}
  jpa:
    hibernate:
      # Only auto-creates the NEW tables this app owns (app_users, sync_config).
      # The existing projects/tasks/custom_fields tables from the Node sync
      # are managed by schema.sql, not by Hibernate - see model classes for
      # the ones marked read-mostly.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-production}
    expiration-ms: 86400000 # 24h

asana:
  token: ${ASANA_TOKEN:2/1206799242588878/1217037767975560:26b43b6058fde5375f537d7820c9b9a4}
  workspace-gid: ${ASANA_WORKSPACE_GID:943649575918213}

sync:
  default-cron: "0 0 3 * * *" # 3am daily, matches the Node nightly resync
