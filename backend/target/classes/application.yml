server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/asana_mirror
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Only auto-creates the NEW tables this app owns (app_users, sync_config).
      # The existing projects/tasks/custom_fields tables from the Node sync
      # are managed by schema.sql, not by Hibernate - see model classes for
      # the ones marked read-mostly.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-production}
    expiration-ms: 86400000 # 24h
  cors:
    # Comma-separated origin patterns ('*' wildcard allowed). Defaults cover
    # localhost plus the two most common private LAN ranges so the app works
    # over the network out of the box; override if your subnet differs.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://192.168.*.*:3000,http://10.*.*.*:3000}

asana:
  token: ${ASANA_TOKEN}
  workspace-gid: ${ASANA_WORKSPACE_GID:943649575918213}

jira:
  site-url: ${JIRA_SITE_URL}
  email: ${JIRA_EMAIL}
  api-token: ${JIRA_API_TOKEN}

sitelist:
  base-url: ${SITELIST_BASE_URL:http://192.168.102.32/views}

sync:
  default-cron: "0 0 3 * * *" # 3am daily, matches the Node nightly resync
